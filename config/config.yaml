# Watchdog configuration. Secrets are NEVER stored here -- only env var names.
version: 1

# SQLite history/state database. The GitHub Actions workflow restores this from cache.
database: state/watchdog.db

http:
  timeout_seconds: 20
  max_retries: 3
  backoff_factor: 0.5
  min_delay_seconds: 1.0
  user_agent: "portfolio-watchdog/1.0 (+https://github.com/sklevel8/job-price-watchdog)"

notifications:
  discord_webhook_env: DISCORD_WEBHOOK_URL
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  dry_run: false
  alert_burst_warning_threshold: 25
  request_timeout_seconds: 10

rules:
  # South African tech employers with public Greenhouse job boards.
  # Greenhouse's job API is keyless and returns canonical job URLs.
  - name: ozow-jobs
    kind: job
    enabled: true
    source:
      format: greenhouse_json
      url: https://boards-api.greenhouse.io/v1/boards/ozow/jobs
    match:
      keywords: []
      exclude_keywords: [intern, internship]
      max_age_days: 180
    bootstrap: alert

  - name: entersekt-jobs
    kind: job
    enabled: true
    source:
      format: greenhouse_json
      url: https://boards-api.greenhouse.io/v1/boards/entersekt/jobs
    match:
      keywords: []
      exclude_keywords: [intern, internship]
      max_age_days: 180
    bootstrap: alert

  - name: luno-jobs
    kind: job
    enabled: true
    source:
      format: greenhouse_json
      url: https://boards-api.greenhouse.io/v1/boards/luno/jobs
    match:
      keywords: []
      exclude_keywords: [intern, internship]
      max_age_days: 180
    bootstrap: alert

  # Valve's public app-details API, priced in South African rand (cc=za).
  # Replace the appids with the games you actually want to watch.
  - name: steam-price-watch
    kind: price
    enabled: true
    source:
      format: steam_appdetails
      url: https://store.steampowered.com/api/appdetails
      params:
        appids: "1086940,1091500,1245620,292030,1145360"
        cc: za
    match:
      max_price: 800.00
      currency: ZAR
    bootstrap: alert

  # Template for any static HTML product page. Disabled by default.
  - name: example-generic-product
    kind: price
    enabled: false
    source:
      format: generic_html
      url: https://example.com/product/widget
      item_selector: "div.product_main"
      title_selector: "h1"
      price_selector: ".price_color"
    match:
      max_price: 800.00
      currency: ZAR
    bootstrap: suppress
