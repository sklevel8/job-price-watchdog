name: Watchdog ETL

# Serverless cron: GitHub runs this workflow from the default branch every 6 hours.
# Schedules are UTC and may start a few minutes late during peak GitHub load.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview matches without writing state or sending alerts"
        type: boolean
        default: false
      log_level:
        description: "Log verbosity"
        type: choice
        options:
          - INFO
          - DEBUG
          - WARNING
        default: INFO

# The pipeline only reads the repository. State lives in the Actions cache.
permissions:
  contents: read

# Never let two runs update the same SQLite state concurrently.
concurrency:
  group: watchdog-etl
  cancel-in-progress: false

jobs:
  run-watchdog:
    name: Run ETL watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Optional channels. Missing secrets simply fall back to console logging.
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from config import load_config; load_config('config/config.yaml'); print('configuration valid')"

      - name: Restore watchdog state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state
          # A unique key per run lets the post-run save always write a fresh
          # snapshot; restore-keys pulls the most recent snapshot first.
          key: watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            watchdog-state-

      - name: Run ETL pipeline
        id: etl
        env:
          # Scheduled runs have no inputs, so these default to false / INFO.
          DRY_RUN: ${{ inputs.dry_run }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
        run: |
          set -uo pipefail
          args=(
            --json-report reports/latest.json
            --summary-file "$GITHUB_STEP_SUMMARY"
            --log-level "$LOG_LEVEL"
            --log-format json
          )
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            args+=(--dry-run)
          fi
          set +e
          python src/main.py "${args[@]}"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Save watchdog state
        if: always() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: state
          key: watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            state/*.ledger.json
          if-no-files-found: warn
          retention-days: 14
